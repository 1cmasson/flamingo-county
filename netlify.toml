# Flamingo County — static site, no build step.
#
# The pages are Claude Design `.dc.html` documents. support.js (the dc-runtime)
# compiles them in the browser, so there is nothing to compile at deploy time —
# Netlify just serves the files as they are.

[build]
  publish = "."
  command = ""

[build.processing]
  # Must stay false: skipping post-processing also disables Netlify's form
  # detection, and forms.html is the only thing registering our two forms.
  skip_processing = false

[build.processing.html]
  # Must stay false. Netlify's "pretty URLs" 301s /Home.dc.html to /home.dc —
  # it strips .html and lowercases the path. href() in fc-data.js emits the
  # `City.dc.html?...` form, so leaving this on redirects every internal link
  # in the site to a lowercased, extension-stripped URL.
  pretty_urls = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Fingerprinted-enough image assets: safe to cache hard.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/mascots/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# The pages and the runtime change together — revalidate every time.
[[headers]]
  for = "/*.dc.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
