<!DOCTYPE html>
<!--
  Flamingo County — offline fallback, served by sw.js when a navigation fails.

  Deliberately NOT a .dc.html document: those are templates that support.js compiles in
  the browser using React and Babel fetched from unpkg, so a .dc.html offline page would
  need the very network it is reporting as gone. Everything here is inline and local.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0C0F14">
<title>Offline — Flamingo County</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#FF2E88;color:#0C0F14;
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:24px;
  -webkit-text-size-adjust:100%;
}
.card{
  width:100%;max-width:420px;text-align:center;
  background:#FFF6E5;border:5px solid #0C0F14;border-radius:22px;
  padding:32px 24px;box-shadow:10px 10px 0 #0C0F14;
}
img{width:132px;height:132px;display:block;margin:0 auto 18px;border-radius:50%}
h1{margin:0 0 6px;font-size:26px;line-height:1.1;letter-spacing:-.01em}
h2{margin:0 0 18px;font-size:19px;line-height:1.15;font-weight:800;color:#0C0F14;opacity:.72}
p{margin:0 0 6px;font-size:15px;line-height:1.45}
p.es{margin-bottom:22px;opacity:.72}
button{
  font-family:inherit;font-size:15px;font-weight:800;cursor:pointer;
  border:0;border-radius:999px;padding:13px 30px;
  background:#FFD400;color:#0C0F14;box-shadow:0 4px 0 #0C0F14;
}
button:active{transform:translateY(2px);box-shadow:0 2px 0 #0C0F14}
</style>
</head>
<body>
<div class="card">
  <img src="/uploads/fc-icon-192.png" alt="Flamingo County">
  <h1>You're offline</h1>
  <h2>Estás sin conexión</h2>
  <p>This page hasn't been opened on this device yet, so there's nothing saved to show.</p>
  <p class="es">Esta página aún no se ha abierto en este dispositivo, así que no hay nada guardado que mostrar.</p>
  <button type="button" onclick="location.reload()">Try again · Reintentar</button>
</div>
</body>
</html>
