name: Lighthouse CI

# Builds the exact image Railway deploys (web/Dockerfile, repo root as build
# context — see the comment at the top of that file), seeds it with the same
# fixture content as local dev, and runs Lighthouse against it. Scores start
# as warnings, not hard failures: the goal right now is visibility into
# regressions, not blocking every PR before there's a baseline to tune
# thresholds against.
on:
  pull_request:
    paths:
      - 'web/**'
      - 'assets/**'
      - 'mascots/**'
      - 'uploads/**'
      - 'vendor/**'
      - 'fc-data.js'
      - 'data-import/**'
      - 'lighthouserc.json'
      - '.github/workflows/lighthouse.yml'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t fc-ci -f web/Dockerfile .

      - name: Start the container
        run: |
          docker run -d --name fc-ci -p 3000:3000 \
            -e DATABASE_URL=file:/data/content.db \
            -e MEDIA_DIR=/data/media \
            -e PAYLOAD_SECRET=ci-only-secret-not-for-prod \
            -e BETTER_AUTH_SECRET=ci-only-secret-not-for-prod \
            -e AUTH_DATABASE_URL=file:/data/auth.db \
            fc-ci

      - name: Wait for the server to accept connections
        # The DB is still empty at this point (only the schema migration has
        # run) — checking for a 2xx here would require the homepage to
        # render against zero content, which isn't the thing being tested.
        # This only confirms the process came up (curl reports "000" when it
        # can't connect at all, and a real status code otherwise, even an
        # error one); the real content check is after seeding, below.
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/en || true)
            if [ "$code" != "000" ]; then
              echo "server is accepting connections (http $code)"
              exit 0
            fi
            sleep 2
          done
          echo "server never started listening"
          docker logs fc-ci
          exit 1

      - name: Seed fixture content
        run: |
          docker exec \
            -e DATABASE_URL=file:/data/content.db \
            -e MEDIA_DIR=/data/media \
            -e PAYLOAD_SECRET=ci-only-secret-not-for-prod \
            fc-ci pnpm seed

      - name: Restart so the running server picks up seeded content
        # Same reasoning as the first wait: under `set -e` (the default for
        # GitHub's `run:` steps), curl's own non-zero exit on a refused
        # connection — not just a bad HTTP status — kills the step on the
        # very first attempt instead of letting the loop retry, which is what
        # actually failed here the first time this workflow ran.
        run: |
          docker restart fc-ci
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/en || true)
            if [ "$code" = "200" ]; then
              echo "server is back up"
              exit 0
            fi
            sleep 2
          done
          echo "server never came back"
          docker logs fc-ci
          exit 1

      - name: Confirm the boot checked its migrations
        # docker-entrypoint.sh runs scripts/migrate.sh, which believes
        # `payload migrate` only once scripts/check-migrated.mjs has found every
        # migration in the database. Both boots above went through it; this
        # proves the check really ran there, not just in the image build.
        run: |
          docker logs fc-ci 2>&1 | grep -E 'check-migrated|migrate:' || true
          docker logs fc-ci 2>&1 | grep -q 'check-migrated: all [0-9]* migrations applied'

      - name: Confirm a real media file is actually being served
        # Catches a MEDIA_DIR mismatch between the seed process and the
        # server silently — that would make every image 404 and Lighthouse
        # would score a page with no images as fast, which is worse than no
        # check at all.
        run: |
          media_path=$(curl -s http://localhost:3000/en | grep -oE '/api/media/file/[A-Za-z0-9._-]+\.webp' | head -1 || true)
          if [ -z "$media_path" ]; then
            echo "no /api/media/file/*.webp URL found in the homepage HTML"
            exit 1
          fi
          content_type=$(curl -s -o /dev/null -w '%{content_type}' "http://localhost:3000$media_path" || true)
          echo "$media_path -> $content_type"
          case "$content_type" in
            image/webp*) echo "ok" ;;
            *) echo "expected image/webp, got $content_type"; exit 1 ;;
          esac

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/en
            http://localhost:3000/en/havana
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Tear down
        if: always()
        run: docker rm -f fc-ci
