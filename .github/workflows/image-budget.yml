name: Image budget

on:
  pull_request:
    paths:
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.webp'
      - '**/*.avif'
      - '**/*.gif'
      - '**/*.svg'
      - '.github/workflows/image-budget.yml'
      - 'web/scripts/check-image-budget.mjs'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check changed images against budget
        run: |
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.sha }}" \
            | node web/scripts/check-image-budget.mjs
