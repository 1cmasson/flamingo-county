<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Archivo:wght@400;600;800&family=Archivo+Black&display=swap" rel="stylesheet" />
<link rel="icon" href="uploads/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="16x16" href="uploads/flamingo-city-favicon-16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="uploads/flamingo-city-favicon-32.png" />
<link rel="icon" type="image/png" sizes="48x48" href="uploads/flamingo-city-favicon-48.png" />
<link rel="icon" type="image/png" sizes="512x512" href="uploads/flamingo-city-favicon-512.png" />
<meta name="theme-color" content="#0C0F14" />
<style>
*{box-sizing:border-box}
body{margin:0;background:#FF2E88;-webkit-text-size-adjust:100%}
@media (max-width:900px){[data-stack]{grid-template-columns:1fr !important}}
@media (max-width:620px){[data-hide-xs]{display:none !important}}
a{color:#0C0F14;text-decoration:none}
a:hover{color:#FFF6E5}
input,button,select,textarea{font-family:inherit}
@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes riseIn{from{opacity:0;transform:translateY(34px)}to{opacity:1;transform:none}}
@keyframes clipIn{from{opacity:0;clip-path:inset(0 0 90% 0);transform:translateY(24px)}to{opacity:1;clip-path:inset(0 0 0 0);transform:none}}
@keyframes tiltIn{from{opacity:0;transform:translateY(44px) rotate(-5deg)}to{opacity:1;transform:rotate(-1.6deg)}}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes walkDown{from{top:0}to{top:calc(100% - 88px)}}
@media (max-width:1150px){[data-rail]{display:none !important}[data-storygrid]{grid-template-columns:minmax(0,1fr) !important}}
[data-navdesk]{display:flex}
[data-navburger]{display:none}
[data-navpanel]{display:none}
@media (max-width:1020px){[data-navdesk]{display:none !important}[data-navburger]{display:flex !important}[data-navpanel]{display:flex !important}}
@media (max-width:720px){[data-caltitles]{display:none !important}[data-caldots]{display:flex !important}}
</style>
<script src="./image-slot.js"></script>
<script src="./fc-data.js"></script>
<script src="./no-touch-hover.js"></script>
</helmet>
  <div style="background:#0C0F14;border-top:5px solid #16E0F2;padding:clamp(20px,4vw,26px) clamp(12px,3.5vw,22px);margin-top:0">
    <div data-stack style="max-width:1280px;margin:0 auto 22px;display:grid;grid-template-columns:1fr 0.9fr;gap:clamp(14px,3vw,26px);align-items:center;padding-bottom:22px;border-bottom:3px dotted #16E0F2">
      <div style="display:flex;flex-direction:column;gap:9px">
        <div style="align-self:flex-start;background:#FFD400;color:#0C0F14;font-weight:800;font-size:11px;letter-spacing:2px;padding:6px 10px">{{ t.nlKicker }}</div>
        <div style="font-family:'Luckiest Guy', cursive;font-size:clamp(20px,4.6vw,28px);line-height:1.02;color:#FFF6E5;text-wrap:balance">{{ t.nlH }}</div>
      </div>
      <div style="display:flex;flex-direction:column;gap:9px;min-width:0">
        <sc-if value="{{ subbed }}">
          <div style="background:#FFD400;border:4px solid #FFF6E5;box-shadow:5px 5px 0 #16E0F2;padding:14px;font-family:'Luckiest Guy', cursive;font-size:clamp(17px,4.2vw,21px);line-height:1.12;color:#0C0F14">{{ t.nlThanks }}</div>
        </sc-if>
        <sc-if value="{{ notSubbed }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex;gap:9px;flex-wrap:wrap">
            <input value="{{ email }}" onChange="{{ onEmail }}" placeholder="{{ t.nlPh }}" style="flex:0 1 auto;width:50%;min-width:0;font-size:15px;font-weight:600;padding:12px 13px;border:4px solid #FFF6E5;background:linear-gradient(160deg,#FFFFFA 0%,#FFF6E5 55%,#F4E3C6 100%);color:#0C0F14;outline:none" />
            <button onClick="{{ subscribe }}" style="cursor:pointer;font-family:'Luckiest Guy', cursive;font-size:16px;padding:12px 17px 9px;border:4px solid #FFF6E5;background:#FF2E88;color:#FFF6E5;box-shadow:4px 4px 0 #16E0F2" style-hover="transform:translate(-1px,-1px);box-shadow:6px 6px 0 #16E0F2">{{ t.nlBtn }}</button>
          </div>
          <div style="font-weight:800;font-size:11px;letter-spacing:1.4px;color:#16E0F2">{{ t.nlFine }}</div>
        </sc-if>
      </div>
    </div>
    <div style="max-width:1280px;margin:0 auto;display:flex;gap:clamp(12px,2.5vw,18px);flex-wrap:wrap;align-items:center;color:#FFF6E5">
      <div style="display:flex;align-items:center;gap:12px"><img src="uploads/flamingo-city-mark-76.png" alt="Flamingo County" style="height:clamp(38px,9vw,52px);width:auto;display:block" /><div style="font-family:Archivo, sans-serif;font-weight:800;font-size:clamp(11px,2.4vw,14px);letter-spacing:2.2px;color:#16E0F2">FLAMINGOCOUNTY.COM · 305</div></div>
      <div style="font-weight:600;font-size:13px">{{ t.footerCities }}</div>
      <a href="{{ aboutHref }}" style="font-weight:800;font-size:12px;letter-spacing:1.6px;color:#16E0F2;text-decoration:none">{{ navT.about }}</a>
      <div style="font-weight:600;font-size:12px;color:#16E0F2;margin-left:auto">{{ t.footerNote }}</div>
    </div>
  </div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:320}}">
class Component extends DCLogic {
  state = { email: '', subbed: false, vw: typeof window !== 'undefined' ? window.innerWidth : 1280 };
  constructor(p) { super(p); this.adopt(); }
  adopt() { if (this._ok) return true; const B = window.FCBase; if (!B) return false; Object.assign(this, B); this._ok = true; return true; }
  componentDidMount() {
    if (!this.adopt()) { window.addEventListener('fc-base', () => { this.adopt(); this.mount(); this.forceUpdate(); }, { once: true }); return; }
    this.mount();
  }
  componentWillUnmount() { if (this._ok) this.unmount(); }
  renderVals() {
    if (!this.adopt()) return {};
    return { ...this.nlVals(), ...this.navVals('') };
  }
}
</script>
</body>
</html>
